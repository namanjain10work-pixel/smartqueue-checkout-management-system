# PostgreSQL production-style database profile
spring.datasource.url=${SMARTQUEUE_DB_URL:jdbc:postgresql://localhost:5432/smartqueue}
spring.datasource.username=${SMARTQUEUE_DB_USERNAME:postgres}
spring.datasource.password=${SMARTQUEUE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 console must not be available with PostgreSQL
spring.h2.console.enabled=false