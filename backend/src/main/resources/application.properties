spring.application.name=SmartQueue
server.port=${PORT:8080}
server.address=0.0.0.0

# Development database
spring.datasource.url=jdbc:h2:file:./data/smartqueue
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 browser console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Do not expose long Java stack traces in the browser
server.error.include-stacktrace=never
server.error.include-message=always

# Optional Python ML prediction service
# The explainable Java rule remains the default.
smartqueue.ml.enabled=${SMARTQUEUE_ML_ENABLED:false}
smartqueue.ml.base-url=${SMARTQUEUE_ML_BASE_URL:http://127.0.0.1:8001}
