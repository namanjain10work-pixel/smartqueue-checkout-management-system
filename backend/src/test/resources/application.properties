# Isolated in-memory database used only by automated tests
spring.datasource.url=jdbc:h2:mem:smartqueue_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Build a fresh schema for every test run
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Browser console is unnecessary during tests
spring.h2.console.enabled=false